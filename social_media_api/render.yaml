services:
  - type: web
    name: social-media-api
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --noinput
    startCommand: "uvicorn social_media_api.asgi:application --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/
    autoDeploy: true
