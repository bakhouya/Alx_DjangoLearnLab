{% extends "blog/base.html" %}
{% block title %}Delete Post{% endblock %}

{% block content %}
<section class="flex_center container content_app">
    <div class="auth_card">
        <h3 class="text_name">Confirm Delete</h3>
        <p class="text_base">Are you sure you want to delete "{{ object.title }}"?</p>
        <form method="post" class="flex_auto">
            {% csrf_token %}
            <button type="submit" class="btn_danger text_danger">Yes</button>
            <a href="{% url 'posts' %}" class="btn_secondary text_base">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
