<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Blog{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header class="header">
        <div class="container nav_container">

            <!-- ======================= Logo ======================= -->
            <div class="app_logo">
                <a href="/">MyBlog</a>
            </div>

            <!-- ======================= Navigation ======================= -->
            <nav>
                <ul class="nav_list flex_center">

                    {% if user.is_authenticated %}

                        <li><a href="{% url 'posts' %}">Posts</a></li>
                        <li><a href="{% url 'profile' %}">Profile</a></li>
                        <form class="search_form" action="{% url 'search_posts' %}" method="get">
                            <input type="text" name="q" placeholder="Search posts, content or tags..." value="{{ request.GET.q|default:'' }}">
                            <button type="submit">Search</button>
                        </form>
                        {% include "blog/logout.html" %}

                    {% else %}
                        <li><a href="{% url 'login' %}">Login</a></li>
                        <li><a href="{% url 'register' %}">Register</a></li>
                    {% endif %}

                </ul>
            </nav>

        </div>
    </header>


    <div class="content">
        {% block content %}
        <!-- Page-specific content goes here -->
        {% endblock %}
    </div>

    <footer>
        <p>&copy; 2025 Django Blog | By Mostafa Bakhouya</p>
    </footer>

    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
