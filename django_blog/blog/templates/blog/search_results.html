

{% extends "blog/base.html" %}
{% block content %}
<h2>Search results for "{{ query }}"</h2>

{% if posts %}
    {% for post in posts %}
        <div class="post_item">
            <h3><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h3>

            <div class="post_tags">
                {% for tag in post.tags.all %}
                    <a href="{% url 'tag_posts' tag.name %}" class="tag_chip">#{{ tag.name }}</a>
                {% empty %}
                    <span class="no_tags">No tags</span>
                {% endfor %}
            </div>
        </div>
    {% endfor %}
{% else %}
    <p>No posts found.</p>
{% endif %}

{% endblock %}
